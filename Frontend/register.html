<!DOCTYPE html>
<html>

<head>

    <title>Register</title>

</head>

<body>

    <h1>Create Account</h1>

    <form id="registerForm">

        <input
            type="text"
            id="name"
            placeholder="Name"
            required
        >

        <br><br>

        <input
            type="email"
            id="email"
            placeholder="Email"
            required
        >

        <br><br>

        <input
            type="password"
            id="password"
            placeholder="Password"
            required
        >

        <br><br>

        <button type="submit">
            Register
        </button>

    </form>

    <p>
        Already have an account?
        <a href="login.html">Login</a>
    </p>

    <script src="register.js"></script>

</body>

</html>
