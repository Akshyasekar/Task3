<!DOCTYPE html>
<html>

<head>

    <title>Login</title>

</head>

<body>

    <h1>Login</h1>

    <form id="loginForm">

        <input
            type="email"
            id="email"
            placeholder="Email"
            required
        >

        <br><br>

        <input
            type="password"
            id="password"
            placeholder="Password"
            required
        >

        <br><br>

        <button type="submit">
            Login
        </button>

    </form>

    <p>
        New user?
        <a href="register.html">Register</a>
    </p>

    <script src="login.js"></script>

</body>

</html>
